name: Package

# Builds the macOS and Windows installers when a `v*` tag is pushed, keeps them as workflow artifacts and
# attaches them to a draft GitHub release under the stable names in apps/web/src/downloads.ts. A manual
# run builds the selected branch instead. Signing and notarization run only when the corresponding
# secrets exist; see docs/packaging.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A newer manual run on the same branch makes the one in progress obsolete. A tag build is never cancelled.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-15
            args: --target universal-apple-darwin
            artifact: pointer-macos-universal
            installer: target/universal-apple-darwin/release/bundle/dmg/*.dmg
            stable: Pointer-macos-universal.dmg
          - name: Windows x64
            os: windows-latest
            args: ""
            artifact: pointer-windows-x64
            installer: target/release/bundle/nsis/*.exe
            stable: Pointer-windows-x64-setup.exe
    runs-on: ${{ matrix.os }}
    # A hung bundler would otherwise burn up to six hours of macOS minutes, which are billed at 10x.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install
      - name: Add the Intel macOS target for the universal binary
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      # No build cache on purpose: a cache is scoped to the tag that wrote it, and no later tag can read it.

      # The bundler treats a set-but-empty variable as a request to sign, so only export the ones
      # that have a value.
      - name: Export the signing secrets that are set
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<__END__"; echo "${!v}"; echo "__END__"; } >> "$GITHUB_ENV"
            fi
          done
      # Only builds: the release below is made from the uploaded installers, so the build jobs stay read-only.
      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
      - name: Take the short commit hash for the artifact name
        id: commit
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # The release asset name has to match apps/web/src/downloads.ts. Tauri's own versioned file stays
      # out of the artifact, so a re-run cannot upload it beside the stable name.
      - name: Copy the installer to the stable download name
        shell: bash
        run: bash scripts/stage-stable-installer.sh "${{ matrix.installer }}" dist-release "${{ matrix.stable }}"
      # Installers are already compressed, so zipping them again only costs time. Re-running the whole workflow
      # uploads the same artifact names again, hence the overwrite.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ steps.commit.outputs.short }}
          path: dist-release/${{ matrix.stable }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  # Runs only when every platform built, so a release never ends up with just one installer.
  release:
    name: Draft release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pointer-*
          merge-multiple: true
          path: installers
      - name: Attach the installers to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Names must stay identical to STABLE_INSTALLERS in apps/web/src/downloads.ts.
          bash scripts/check-stable-installers.sh installers \
            Pointer-macos-universal.dmg \
            Pointer-windows-x64-setup.exe
          shopt -s nullglob
          files=(installers/*)
          # A re-run updates the existing draft instead of creating a second one.
          # A published release is left untouched, including its assets.
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published; not overwriting its installers."
              exit 1
            fi
            mapfile -t existing < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            for name in "${existing[@]}"; do
              case "$name" in
                Pointer-macos-universal.dmg | Pointer-windows-x64-setup.exe) ;;
                *) gh release delete-asset "$TAG" "$name" --yes ;;
              esac
            done
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --draft --prerelease --title "Pointer $TAG" --generate-notes
          fi
