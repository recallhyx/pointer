<!-- macOS menu-bar template glyph: the app's highlight + dot without the tile. Black + alpha only;
     macOS recolours it for light/dark menu bars. Rendered by scripts/tray-icons.mjs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 10 90 90">
  <mask id="cut">
    <rect width="100" height="100" fill="#fff"/>
    <circle cx="70" cy="66" r="25" fill="#000"/>
  </mask>
  <rect x="8" y="22" width="70" height="38" rx="11" fill="#000" fill-opacity="0.42" mask="url(#cut)"/>
  <circle cx="70" cy="66" r="17" fill="#000"/>
</svg>
